name: Homebrew acceptance

on:
  workflow_dispatch:

permissions: {}

jobs:
  build:
    permissions:
      contents: read
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build archives for selected commit
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          EXPECTED_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse 'HEAD^{commit}')" = "$EXPECTED_COMMIT"
          TAG="v$(tr -d '[:space:]' < VERSION)"
          if [[ "$REF_TYPE" = tag ]]; then
            test "$REF_NAME" = "$TAG"
            test "$(git rev-parse "refs/tags/${TAG}^{commit}")" = "$EXPECTED_COMMIT"
          else
            test "$REF_TYPE" = branch
          fi
          bash scripts/acceptance/release-assets.sh build "$RUNNER_TEMP/assets" "$TAG"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: acceptance-assets
          path: ${{ runner.temp }}/assets/
          if-no-files-found: error
          retention-days: 30

  homebrew:
    needs: build
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: '1'
      HOMEBREW_NO_INSTALL_UPGRADE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: acceptance-assets
          path: ${{ runner.temp }}/assets
      - name: Test native Homebrew installations
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          EXPECTED_COMMIT: ${{ github.sha }}
          EXPECTED_ARCH: ${{ matrix.arch }}
          ASSET_DIR: ${{ runner.temp }}/assets
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse 'HEAD^{commit}')" = "$EXPECTED_COMMIT"
          export TAG="v$(tr -d '[:space:]' < VERSION)"
          if [[ "$REF_TYPE" = tag ]]; then
            test "$REF_NAME" = "$TAG"
            test "$(git rev-parse "refs/tags/${TAG}^{commit}")" = "$EXPECTED_COMMIT"
          else
            test "$REF_TYPE" = branch
          fi
          bash scripts/acceptance/homebrew-release.sh
