name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: homebrew-tap-ianchor
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Use Go from the module requirement
        shell: bash
        run: |
          set -euo pipefail
          sw_vers
          go version
          go env GOTOOLCHAIN GOOS GOARCH CGO_ENABLED

      - name: Verify sources
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test -z "$(git status --porcelain --untracked-files=all --ignored)"
          test -z "$(gofmt -l .)"
          go vet ./...
          GOTOOLCHAIN=local CGO_ENABLED=0 go test ./...
          CGO_ENABLED=1 go test -race ./...
          GOTOOLCHAIN=local CGO_ENABLED=0 go test -count=1 -coverprofile=/tmp/cover.out ./...
          ./scripts/coverage-check.sh /tmp/cover.out
          for arch in amd64 arm64; do
            GOTOOLCHAIN=local CGO_ENABLED=0 GOOS=darwin GOARCH="$arch" go build -trimpath -buildvcs=false -o "/tmp/ianchor-$arch" ./cmd/ianchor
          done
          GOTOOLCHAIN=local CGO_ENABLED=0 go run ./cmd/ianchor --version
          test -z "$(git status --porcelain --untracked-files=all --ignored)"

      - name: Check out verified commit for publishing
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
          clean: true

      - name: Publish release and formula
        env:
          TAG: ${{ github.ref_name }}
          EXPECTED_COMMIT: ${{ github.sha }}
          SOURCE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        shell: bash
        run: bash scripts/release/publish.sh