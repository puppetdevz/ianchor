name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: homebrew-puppetdevz-ianchor
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Use Homebrew Node
        shell: bash
        run: |
          set -euo pipefail
          NODE_PREFIX=$(brew --prefix node)
          if [ ! -x "$NODE_PREFIX/bin/node" ]; then
            brew install node
            NODE_PREFIX=$(brew --prefix node)
          fi
          test -x "$NODE_PREFIX/bin/node"
          test -f "$NODE_PREFIX/libexec/bin/npm"
          echo "$NODE_PREFIX/bin" >> "$GITHUB_PATH"
          echo "$NODE_PREFIX/libexec/bin" >> "$GITHUB_PATH"
          echo "HOMEBREW_NODE_PREFIX=$NODE_PREFIX" >> "$GITHUB_ENV"
          brew list --versions node
          sw_vers
          "$NODE_PREFIX/bin/node" -p 'JSON.stringify({node:process.version,abi:process.versions.modules,platform:process.platform,arch:process.arch,executable:process.execPath})'

      - name: Install precompiled dependencies
        shell: bash
        run: |
          set -euo pipefail
          node "$HOMEBREW_NODE_PREFIX/libexec/bin/npm" ci --ignore-scripts --engine-strict --no-audit --no-fund
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const os = require('node:os');
          const path = require('node:path');
          const { execFileSync } = require('node:child_process');
          const template = fs.readFileSync('Formula/ianchor.rb', 'utf8');
          function method(name) {
            const match = template.match(new RegExp(`  def ${name}\\n    <<~'JS'\\n([\\s\\S]*?)\\n    JS\\n  end`));
            if (!match) throw new Error(`Missing Formula method: ${name}`);
            return match[1].replace(/^      /gm, '');
          }
          // Execute the exact same prebuild-only implementation used by Formula.install.
          execFileSync(process.execPath, ['--input-type=commonjs', '-e', method('prebuild_script')], { stdio: 'inherit' });
          const dir = fs.mkdtempSync(path.join(os.tmpdir(), 'ianchor-ci-sqlite-'));
          try {
            execFileSync(process.execPath, ['--input-type=module', '-e', method('sqlite_probe'), path.resolve('lib/db.js'), dir], { stdio: 'inherit' });
          } finally {
            fs.rmSync(dir, { recursive: true, force: true });
          }
          NODE

      - name: Run tests
        run: |
          npm test

      - name: Publish release and formula
        env:
          TAG: ${{ github.ref_name }}
          SOURCE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          : "${TAG:?Missing tag}" "${SOURCE_TOKEN:?Missing source token}" "${TAP_TOKEN:?Missing HOMEBREW_TAP_TOKEN}"
          REPO="puppetdevz/ianchor"
          TEMPLATE="$PWD/Formula/ianchor.rb"
          VERSION=$(node --input-type=commonjs <<'NODE'
          const assert = require('node:assert/strict');
          const tag = process.env.TAG;
          assert.match(tag, /^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/, 'Only stable vMAJOR.MINOR.PATCH tags are supported');
          assert.equal(require('./package.json').version, tag.slice(1), 'Tag/package version mismatch');
          console.log(tag.slice(1));
          NODE
          )
          WORK=$(mktemp -d)
          trap 'rm -rf "$WORK"' EXIT
          TAP_PATH="$WORK/tap"
          TARBALL_PATH="$WORK/source.tar.gz"
          TARBALL_URL="https://github.com/${REPO}/archive/refs/tags/${TAG}.tar.gz"
          CANDIDATE="$WORK/ianchor.rb"
          RUBY_METADATA="$WORK/ruby-metadata.rb"
          # Accept a static Formula DSL subset; never execute tap Ruby or infer dynamic values.
          cat > "$RUBY_METADATA" <<'RUBY'
          require 'ripper'
          require 'json'
          tree = Ripper.sexp(STDIN.read)
          abort 'Invalid Formula syntax' unless tree
          statements = tree[1].reject { |node| node[0] == :void_stmt }
          klass = statements[0]
          parent = klass && klass[0] == :class ? klass[2] : nil
          unless statements.length == 1 && klass[0] == :class &&
                 klass[1][0] == :const_ref && klass[1][1][1] == 'Ianchor' &&
                 parent&.first == :var_ref && parent.dig(1, 0) == :@const && parent.dig(1, 1) == 'Formula'
            abort 'Expected a single static Ianchor < Formula class'
          end
          body = klass[3]
          abort 'Unsupported Formula class body' unless body[0] == :bodystmt && body.drop(2).all?(&:nil?)
          fields = %w[version url sha256 depends_on]
          declarations = Hash.new { |hash, key| hash[key] = [] }
          literal_nodes = %i[args_add_block string_literal string_content symbol_literal symbol array hash assoclist_from_args bare_assoc_hash assoc_new]
          literal = lambda do |node|
            next true unless node.is_a?(Array)
            next node.all? { |child| literal.call(child) } unless node[0].is_a?(Symbol)
            next true if node[0].to_s.start_with?('@')
            literal_nodes.include?(node[0]) && node.drop(1).all? { |child| literal.call(child) }
          end
          scan_deferred = lambda do |node|
            next unless node.is_a?(Array)
            if node[0] == :@ident && fields.include?(node[1])
              abort 'Metadata must be an unconditional direct Formula class declaration'
            end
            node.each { |child| scan_deferred.call(child) if child.is_a?(Array) }
          end
          body[1].each do |node|
            case node[0]
            when :void_stmt
              next
            when :command
              token, args = node[1], node[2]
              unless (fields + %w[desc homepage license]).include?(token[1]) &&
                     args[0] == :args_add_block && args[2] == false && literal.call(args)
                abort 'Unsupported dynamic Formula declaration; use static literal DSL fields'
              end
              declarations[token[1]] << token[2] if fields.include?(token[1])
            when :def
              abort 'Cannot override Formula metadata methods' if fields.include?(node[1][1])
              scan_deferred.call(node)
            when :method_add_block
              call = node[1]
              unless call[0] == :method_add_arg && call[1][0] == :fcall &&
                     call[1][1][1] == 'test' && call[2] == []
                abort 'Unsupported Formula class-level block'
              end
              # Homebrew registers this block; it does not run while reading metadata.
            else
              abort 'Unsupported conditional or indirect Formula declaration'
            end
          end
          puts JSON.generate(declarations)
          RUBY

          # No credential in remote URL, command log or Git config. The helper contains no secret.
          printf '%s\n' '#!/bin/sh' 'case "$1" in *Username*) printf "%s\n" "x-access-token" ;; *) printf "%s\n" "$TAP_TOKEN" ;; esac' > "$WORK/askpass"
          chmod 700 "$WORK/askpass"
          export GIT_ASKPASS="$WORK/askpass" GIT_TERMINAL_PROMPT=0
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=credential.helper GIT_CONFIG_VALUE_0=
          git clone --branch main --single-branch https://github.com/puppetdevz/homebrew-puppetdevz.git "$TAP_PATH"
          BASE=$(git -C "$TAP_PATH" rev-parse HEAD)
          if [ -L "$TAP_PATH/Formula" ] || [ -L "$TAP_PATH/Formula/ianchor.rb" ]; then
            echo "::error::Formula paths must not be symbolic links" >&2
            exit 1
          fi
          if { [ -e "$TAP_PATH/Formula" ] && [ ! -d "$TAP_PATH/Formula" ]; } || { [ -e "$TAP_PATH/Formula/ianchor.rb" ] && [ ! -f "$TAP_PATH/Formula/ianchor.rb" ]; }; then
            echo "::error::Invalid Formula path type" >&2
            exit 1
          fi

          # Parse legacy metadata without evaluating arbitrary Ruby from the tap.
          node --input-type=commonjs - "$TAP_PATH/Formula/ianchor.rb" "$VERSION" "$RUBY_METADATA" <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const [file, target, parser] = process.argv.slice(2);
          if (!fs.existsSync(file)) process.exit(0);
          const source = fs.readFileSync(file, 'utf8');
          // Ruby syntax, not line starts, identifies declarations. Never evaluate tap code.
          const { execFileSync } = require('node:child_process');
          const declarations = JSON.parse(execFileSync('ruby', [parser], { input: source, encoding: 'utf8' }));
          const lines = source.split(/\r?\n/);
          const fields = key => (declarations[key] ?? []).map(([line, column]) => {
            const text = lines[line - 1];
            const value = text.match(new RegExp(`^[\\t ]*${key}[\\t ]+["']([^"']+)["'][\\t ]*(?:#[^\\r\\n]*)?$`));
            assert.ok(value && !text.slice(0, column).trim(), `Unsupported existing ${key} declaration`);
            return value[1];
          });
          const versions = fields('version'), urls = fields('url'), shas = fields('sha256');
          assert.equal(urls.length, 1, 'Existing Formula must have exactly one source URL');
          assert.equal(shas.length, 1, 'Existing Formula must have exactly one checksum');
          assert.match(shas[0], /^[a-fA-F0-9]{64}$/, 'Invalid existing checksum');
          assert.ok(versions.length <= 1, 'Ambiguous existing version');
          const urlVersion = urls[0].match(/^https:\/\/github\.com\/puppetdevz\/ianchor\/archive\/(?:refs\/tags\/)?v((?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*))\.tar\.gz$/)?.[1];
          assert.ok(urlVersion, 'Cannot identify existing stable version');
          const old = versions[0] ?? urlVersion;
          assert.equal(old, urlVersion, 'Conflicting existing version and URL');
          const a = target.split('.').map(BigInt), b = old.split('.').map(BigInt);
          for (let i = 0; i < 3; i++) {
            if (a[i] > b[i]) break;
            assert.ok(a[i] >= b[i], `Refusing downgrade from ${old} to ${target}`);
          }
          NODE
          if [ -f "$TAP_PATH/Formula/ianchor.rb" ]; then ruby -c "$TAP_PATH/Formula/ianchor.rb"; fi
          curl --fail --location --retry 3 --output "$TARBALL_PATH" "$TARBALL_URL"
          SHA256=$(shasum -a 256 "$TARBALL_PATH" | awk '{print $1}')
          echo "Source archive sha256: $SHA256"
          node --input-type=commonjs - "$TEMPLATE" "$CANDIDATE" "$VERSION" "$TARBALL_URL" "$SHA256" "$RUBY_METADATA" <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const { execFileSync } = require('node:child_process');
          const [template, out, version, url, sha, parser] = process.argv.slice(2);
          assert.match(sha, /^[a-fA-F0-9]{64}$/, 'Invalid archive SHA256');
          let source = fs.readFileSync(template, 'utf8');
          for (const [key, value] of Object.entries({ VERSION: version, URL: url, SHA256: sha })) {
            const marker = `__IANCHOR_${key}__`;
            assert.equal(source.split(marker).length - 1, 1, `Expected one ${marker}`);
            source = source.replace(marker, value);
          }
          assert.doesNotMatch(source, /__IANCHOR_/, 'Unresolved template field');
          const declarations = JSON.parse(execFileSync('ruby', [parser], { input: source, encoding: 'utf8' }));
          const lines = source.split(/\r?\n/);
          for (const [key, expected] of Object.entries({ version, url, sha256: sha, depends_on: 'node' })) {
            assert.equal(declarations[key]?.length, 1, `Expected exactly one real rendered ${key} declaration`);
            const [line, column] = declarations[key][0], text = lines[line - 1];
            const value = text.match(new RegExp(`^[\\t ]*${key}[\\t ]+"([^"]+)"[\\t ]*(?:#[^\\r\\n]*)?$`));
            assert.ok(value && !text.slice(0, column).trim(), `Unsupported rendered ${key} declaration`);
            assert.equal(value[1], expected, `Incorrect rendered ${key}`);
          }
          fs.writeFileSync(out, source);
          NODE
          ruby -c "$CANDIDATE"

          # An API failure is not evidence of absence. First prove repository access.
          GH_TOKEN="$SOURCE_TOKEN" gh api "repos/$REPO" --silent
          set +e
          GH_TOKEN="$SOURCE_TOKEN" gh api --include "repos/$REPO/releases/tags/$TAG" > "$WORK/response" 2> "$WORK/query-error"
          QUERY_STATUS=$?
          set -e
          HTTP_STATUS=$(awk 'NR == 1 {print $2}' "$WORK/response")
          if [ "$QUERY_STATUS" -eq 0 ] && [ "$HTTP_STATUS" = 200 ]; then
            node --input-type=commonjs - "$WORK/response" "$TAG" <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const [file, tag] = process.argv.slice(2);
          const response = fs.readFileSync(file, 'utf8');
          const body = response.split(/\r?\n\r?\n/).slice(1).join('\n\n');
          assert.equal(JSON.parse(body).tag_name, tag, 'Unexpected Release response');
          NODE
            echo "Release $TAG already exists; skipping creation."
          elif [ "$QUERY_STATUS" -ne 0 ] && [ "$HTTP_STATUS" = 404 ]; then
            GH_TOKEN="$SOURCE_TOKEN" gh release create "$TAG" --repo "$REPO" --verify-tag --title "$TAG" --notes "Release $TAG"
          else
            # Classify untrusted stderr without ever printing it (it may contain credentials).
            node --input-type=commonjs - "$WORK/query-error" "$QUERY_STATUS" "${HTTP_STATUS:-unknown}" <<'NODE'
          const fs = require('node:fs');
          const [file, exit, rawStatus] = process.argv.slice(2);
          const status = /^\d{3}$/.test(rawStatus) ? rawStatus : 'unknown';
          const error = fs.readFileSync(file, 'utf8');
          let category = 'API/network', guidance = 'Check GitHub API availability, credentials and proxy connectivity';
          if (status === '401' || status === '403') {
            category = 'authentication/permission'; guidance = 'Check SOURCE_TOKEN contents permissions and repository access';
          } else if (status === '429') {
            category = 'rate limit'; guidance = 'Wait for the GitHub API rate limit to reset';
          } else if (/^5\d\d$/.test(status)) {
            category = 'GitHub service'; guidance = 'Check GitHub API service status';
          } else if (/no such host|ENOTFOUND|name resolution|resolve host/i.test(error)) {
            category = 'DNS'; guidance = 'Check the DNS resolver and api.github.com connectivity';
          } else if (/TLS|SSL|x509|certificate/i.test(error)) {
            category = 'TLS'; guidance = 'Check TLS certificates and HTTPS proxy configuration';
          } else if (/timed? ?out|timeout|ECONN|connection|proxy/i.test(error)) {
            category = 'network'; guidance = 'Check network and proxy connectivity';
          }
          console.error(`::error::Release query failed (${category}; exit=${exit}, HTTP=${status}). ${guidance}; rerun the same tag after resolving. Refusing to infer absence; existing Releases are preserved.`);
          NODE
            exit 1
          fi

          cd "$TAP_PATH"
          REMOTE_BASE=$(git ls-remote origin refs/heads/main | awk '{print $1}')
          if [ "$REMOTE_BASE" != "$BASE" ]; then
            echo "::error::Tap main changed during preparation; rerun after checking the newer version" >&2
            exit 1
          fi
          mkdir -p Formula
          cp "$CANDIDATE" Formula/ianchor.rb
          git add -- Formula/ianchor.rb
          set +e
          git diff --cached --quiet -- Formula/ianchor.rb
          DIFF_STATUS=$?
          set -e
          case "$DIFF_STATUS" in
            0) echo "Formula is unchanged; no commit or push required." ;;
            1)
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git commit -m "chore: update formula for ${TAG}" -- Formula/ianchor.rb
              git push origin HEAD:main
              ;;
            *) echo "::error::Cannot inspect staged Formula diff (exit=$DIFF_STATUS)" >&2; exit "$DIFF_STATUS" ;;
          esac
