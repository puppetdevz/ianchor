name: Release

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  verify:
    permissions:
      contents: read
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Use Go from the module requirement
        shell: bash
        run: |
          set -euo pipefail
          sw_vers
          go version
          go env GOTOOLCHAIN GOOS GOARCH CGO_ENABLED

      - name: Verify sources
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test -z "$(git status --porcelain --untracked-files=all --ignored)"
          test -z "$(gofmt -l .)"
          go vet ./...
          GOTOOLCHAIN=local CGO_ENABLED=0 go test ./...
          CGO_ENABLED=1 go test -race ./...
          GOTOOLCHAIN=local CGO_ENABLED=0 go test -count=1 -coverprofile=/tmp/cover.out ./...
          ./scripts/coverage-check.sh /tmp/cover.out
          for arch in amd64 arm64; do
            GOTOOLCHAIN=local CGO_ENABLED=0 GOOS=darwin GOARCH="$arch" go build -trimpath -buildvcs=false -o "/tmp/ianchor-$arch" ./cmd/ianchor
          done
          GOTOOLCHAIN=local CGO_ENABLED=0 go run ./cmd/ianchor --version
          test -z "$(git status --porcelain --untracked-files=all --ignored)"

      - name: Build release archives
        env:
          TAG: ${{ github.ref_name }}
          EXPECTED_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse 'HEAD^{commit}')" = "$EXPECTED_COMMIT"
          test "$(git rev-parse "refs/tags/${TAG}^{commit}")" = "$EXPECTED_COMMIT"
          bash scripts/acceptance/release-assets.sh build "$RUNNER_TEMP/assets" "$TAG"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          path: ${{ runner.temp }}/assets/
          if-no-files-found: error
          retention-days: 30

  homebrew:
    needs: verify
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: '1'
      HOMEBREW_NO_INSTALL_UPGRADE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: ${{ runner.temp }}/assets
      - name: Test native Homebrew installations
        env:
          TAG: ${{ github.ref_name }}
          EXPECTED_COMMIT: ${{ github.sha }}
          EXPECTED_ARCH: ${{ matrix.arch }}
          ASSET_DIR: ${{ runner.temp }}/assets
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse 'HEAD^{commit}')" = "$EXPECTED_COMMIT"
          test "$(git rev-parse "refs/tags/${TAG}^{commit}")" = "$EXPECTED_COMMIT"
          bash scripts/acceptance/homebrew-release.sh

  release:
    needs: [verify, homebrew]
    concurrency:
      group: release-publish-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write
    runs-on: macos-latest
    steps:
      - name: Check out verified commit for publishing
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
          clean: true

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: ${{ runner.temp }}/assets

      - name: Verify release archives
        env:
          TAG: ${{ github.ref_name }}
        shell: bash
        run: bash scripts/acceptance/release-assets.sh verify "$RUNNER_TEMP/assets" "$TAG"

      - name: Publish release and formula
        env:
          ASSET_DIR: ${{ runner.temp }}/assets
          TAG: ${{ github.ref_name }}
          EXPECTED_COMMIT: ${{ github.sha }}
          SOURCE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        shell: bash
        run: bash scripts/release/publish.sh